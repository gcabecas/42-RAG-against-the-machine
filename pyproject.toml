[project]
name = "rag"
version = "1.0.0"
description = "rag"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.9",
    "fire",
    "flake8",
    "mypy",
    "pydantic",
    "torch>=2.0.0",
    "transformers>=4.51.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student"]
